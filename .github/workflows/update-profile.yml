name: Update GitHub Profile

on:
  schedule:
    # Every 6 hours (UTC). Scheduled jobs may be delayed by GitHub.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_readme.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate project, skill, and activity sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Piyumal78
        run: python scripts/update_readme.py

      - name: Commit only if README changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'No README updates.'
          else
            git commit -m 'docs: auto-update GitHub profile'
            git push
          fi
